name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS ships bash 3.2 and BSD tools; Ubuntu has bash 5 and GNU tools.
        # The scripts must work on both.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Script tests
        run: tests/run.sh

      - name: The repo passes its own checks
        run: |
          skills/create-skill/scripts/wire-skills.sh
          skills/create-skill/scripts/check-skill-deps.sh
